# Spec 004: la app manda cada log en JSON por TCP (appender de Logstash de JHipster). Sin filtros: ya llegan estructurados.
input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "tracker-logs-%{+YYYY.MM.dd}"
  }
}
