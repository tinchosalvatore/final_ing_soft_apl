# Spec 004 / ADR-0004: ELK para logs centralizados. Entorno local o de demo: sin seguridad de Elastic.
# Uso (desde la raíz del repo): docker compose --env-file .env -f src/main/docker/elk.yml up -d
# Pasos completos en src/main/docker/elk/README.md
name: trackergastos-elk
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elk-datos:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:9200/_cluster/health | grep -qE "green|yellow"']
      interval: 10s
      timeout: 5s
      retries: 30
    # Solo para depurar; quitar el prefijo 127.0.0.1 expone el puerto fuera de la PC
    ports:
      - 127.0.0.1:9200:9200
  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.5
    volumes:
      - ./elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.monitoring.enabled=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - 127.0.0.1:5000:5000
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Necesaria para las reglas de alerta (32 caracteres o más). Sale de .env: ver .env.example
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:?Falta KIBANA_ENCRYPTION_KEY, ver .env.example}
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - 127.0.0.1:5601:5601
volumes:
  elk-datos:
