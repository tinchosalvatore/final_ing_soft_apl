# Valores de muestra que application-prod.yml usa como fallback cuando falta la variable de entorno.
# Solo para CI/E2E y el compose de demo: un despliegue real arranca con el perfil prod solo (docs/catedra/12-factors.md §2).
samples:
  datasource-url: jdbc:postgresql://localhost:5432/trackerGastos
  # Con este contexto no corre el changeset de S5: quedan admin/admin y user/user para los E2E
  liquibase-contexts: prod, secret-samples
  # Hash de 'admin' (el mismo de config/liquibase/data/user.csv); no se aplica porque el changeset de S5 no corre
  admin-password-hash: $2a$10$gSAhZrxMllrbgj/kkK9UceBPpChGWJA7SYIb1Mqo.n5aNLq1/oRrC
  # Spec 001, regla 16: en el perfil de muestras el registro sigue disponible (E2E register-page y helpers de testing)
  registro-habilitado: true
